name: Build and test Python package

on:
  push:
    branches: [ main, stable, oldstable, middleware ]
  pull_request:
    branches: [ main, stable, oldstable, middleware ]

jobs:
  linting:
    name: Linting
    runs-on: 'ubuntu-latest'
    strategy:
        matrix:
          python-version:
            - "3.11"
            - "3.12"
            - "3.13"
            - "3.14"
            - "3.15"

    steps:
      - uses: actions/checkout@v7
      - name: Check with black, pylint and pontos.version
        uses: greenbone/actions/lint-python@v3
        with:
          python-version: ${{ matrix.python-version }}
          packages: ospd_openvas ospd tests
          linter: pylint

  test:
    name: Run all tests
    runs-on: 'ubuntu-latest'
    strategy:
        matrix:
          python-version:
            - "3.11"
            - "3.12"
            - "3.13"
            - "3.14"
            - "3.15"

    steps:
      - uses: actions/checkout@v7
      - name: Install poetry and dependencies
        uses: greenbone/actions/poetry@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: poetry run python -m unittest

  all-python-ci-jobs-passed:
    name: All Python CI jobs passed
    needs: [linting, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
